[package]
name = "magicmed-desktop"
version = "0.1.0"
description = "MagicMed v2 - client lourd cabinet médical"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }
genpdf = "0.2"
bcrypt = "0.15"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi"] }

[features]
default = []
sesam-vitale = []   # FFI sgpv.dll (FSV) - Windows uniquement, phase 2
